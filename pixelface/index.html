<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Pixel Face</title>
<link rel="manifest" href="/pixelface/manifest.webmanifest">
<link rel="apple-touch-icon" href="/pixelface/icon-180.png">
<link rel="icon" href="/pixelface/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Pixel Face">
<meta name="theme-color" content="#0e161c">
<style>
  html,body{margin:0;height:100%;background:#0e161c;color:#dce7ee;font-family:system-ui,-apple-system,sans-serif}
  .wrap{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;
    padding-top:calc(24px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
  img{width:96px;height:96px;border-radius:22px}
  h1{margin:0;font:600 15px ui-monospace,monospace;letter-spacing:.35em}
  p{margin:0;color:#8aa0ad;font-size:14px;text-align:center;max-width:300px;line-height:1.45}
  form{display:flex;gap:8px;width:min(340px,100%)}
  input{flex:1;min-width:0;font-size:16px;padding:12px 14px;border-radius:12px;border:1px solid rgba(170,200,220,.25);background:#15212a;color:#dce7ee;outline:none}
  button{font-size:15px;font-weight:600;padding:0 18px;border-radius:12px;border:0;background:#9fd3f0;color:#0d1820;cursor:pointer}
  .err{color:#ff9d9d;min-height:1.2em}
  .bar{width:min(340px,100%);height:6px;border-radius:3px;background:#1d2b35;overflow:hidden;display:none}
  .bar i{display:block;height:100%;width:0;background:#9fd3f0;transition:width .2s}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <img src="/pixelface/icon-192.png" alt="">
  <h1>PIXEL FACE</h1>
  <p id="msg">Private. Enter your password to unlock.</p>
  <form id="f" autocomplete="off">
    <input id="pw" type="password" placeholder="Password" autocapitalize="none" autocorrect="off" spellcheck="false">
    <button>Unlock</button>
  </form>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="err" id="err"></div>
</div>
<script>
(() => {
// The real page is stored encrypted (AES-GCM, key from the password via PBKDF2),
// so the copy in the public repo and on the site can't be read without the password.
const KEY = 'pf_unlock';
const $ = id => document.getElementById(id);
let blob = null;
async function getBlob(){
  if (blob) return blob;
  const res = await fetch('/pixelface/page.bin', { cache: 'no-cache' });
  if (!res.ok) throw new Error('download');
  const total = +res.headers.get('content-length') || 0, reader = res.body.getReader(), parts = []; let got = 0;
  $('bar').style.display = 'block';
  for (;;){ const { done, value } = await reader.read(); if (done) break; parts.push(value); got += value.length; if (total) $('fill').style.width = (got/total*100).toFixed(0) + '%'; }
  const out = new Uint8Array(got); let o = 0; for (const p of parts){ out.set(p, o); o += p.length; }
  return blob = out;
}
async function unlock(pw){
  $('err').textContent = ''; $('msg').textContent = 'Unlocking…';
  const data = await getBlob();
  const salt = data.slice(0,16), iv = data.slice(16,28), ct = data.slice(28);
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt, iterations:250000, hash:'SHA-256' }, base, { name:'AES-GCM', length:256 }, false, ['decrypt']);
  let gz;
  try { gz = await crypto.subtle.decrypt({ name:'AES-GCM', iv }, key, ct); }
  catch(e){ try { localStorage.removeItem(KEY); } catch(_){} throw new Error('pw'); }
  const html = await new Response(new Blob([gz]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  try { localStorage.setItem(KEY, pw); } catch(_){}
  document.open(); document.write(html); document.close();
}
function fail(e){
  $('msg').textContent = 'Private. Enter your password to unlock.';
  $('err').textContent = e && e.message === 'pw' ? 'Wrong password.' : e && e.message === 'download' ? 'Couldn\'t load — check your connection.' : 'This browser is too old to open it.';
}
$('f').addEventListener('submit', e => { e.preventDefault(); const pw = $('pw').value.trim(); if (pw) unlock(pw).catch(fail); });
let saved = null; try { saved = localStorage.getItem(KEY); } catch(_){}
if (saved){ $('f').style.display = 'none'; unlock(saved).catch(e => { $('f').style.display = 'flex'; fail(e); }); }
})();
</script>
</body>
</html>
